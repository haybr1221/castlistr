name: CI

# Runs on every pull request, and on pushes to main (so main is always checked too).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # TODO: add `npm run lint` once the existing lint errors are fixed
      - run: npm test
      - run: npm run build
        env:
          # Only needs to exist for the build; no real API is called during it.
          VITE_API_URL: http://localhost:3000
